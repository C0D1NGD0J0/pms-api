name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NODE_VERSION: "22"
  JWT_SECRET: ci-test-secret
  JWT_REFRESH_SECRET: ci-test-refresh-secret
  STRIPE_SECRET_KEY: sk_test_ci_placeholder

jobs:
  # Lightweight job for Dependabot/security PRs — only verify install + build
  dependency-check:
    name: Dependency Check
    if: github.actor == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          REDISMS_DISABLE_POSTINSTALL: "1"

      - name: Build
        run: npm run build

  lint:
    name: Lint & Format
    if: github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          REDISMS_DISABLE_POSTINSTALL: "1"

      - name: Check formatting
        run: npm run prettier:check

      - name: Lint
        run: npm run lint

  typecheck:
    name: TypeScript
    if: github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          REDISMS_DISABLE_POSTINSTALL: "1"

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.build.json

  unit-tests:
    name: Unit Tests
    if: github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Redis binary
        id: redis-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/redis-memory-server
          key: redis-binary-${{ runner.os }}-${{ runner.arch }}-7.2.7

      - name: Install dependencies
        run: npm ci
        env:
          REDISMS_DOWNLOAD_DIR: ~/.cache/redis-memory-server

      - name: Run unit tests
        run: npm test
        env:
          REDISMS_DOWNLOAD_DIR: ~/.cache/redis-memory-server

  build:
    name: Build
    if: github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          REDISMS_DISABLE_POSTINSTALL: "1"

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:docker')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
